<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historia - Betva</title>
<link rel="stylesheet" href="/css/style.css?v=8">
</head>
<body>
<div class="container page">
  <div id="header">
    <h1>Betva</h1>
    <p class="muted" id="hello"></p>
  </div>
  <section id="sec-historia">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn small" data-filter="7">Siku 7</button>
      <button class="btn small secondary" data-filter="90">Siku 90</button>
    </div>
    <div id="summary" class="muted" style="margin-bottom:12px"></div>
    <div id="history-list"></div>
  </section>
</div>
<nav class="bottom-nav">
  <button data-tab="leo"><span class="icon">⚽</span>Leo</button>
  <button data-tab="malipo"><span class="icon">💰</span>Malipo</button>
  <button data-tab="mimi"><span class="icon">👤</span>Mimi</button>
  <button data-tab="historia" class="active"><span class="icon">📜</span>Historia</button>
</nav>
<!-- Modal for [See] -->
<div id="modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;padding:20px;overflow:auto">
  <div class="card" style="max-width:500px;margin:40px auto">
    <button class="btn secondary small" onclick="closeModal()" style="float:right">✕</button>
    <h3 id="modal-title"></h3>
    <div id="modal-content"></div>
  </div>
</div>
<script src="/js/api.js?v=4"></script>
<script src="/js/historia.js?v=1"></script>
</body>
</html>
