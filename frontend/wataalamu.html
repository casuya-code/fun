<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wataalamu - Betva</title>
<link rel="stylesheet" href="/css/style.css?v=8">
</head>
<body>

<div class="container page">

    <h1>Betva</h1>

</div>
<nav class="bottom-nav">
  <button data-tab="picks"><span class="icon">🎯</span>Mechi</button>
  <button data-tab="mypicks"><span class="icon">📝</span>Mkeka</button>
  <button data-tab="experts" class="active"><span class="icon">🏆</span>Wataalamu</button>
  <button data-tab="me"><span class="icon">👤</span>Mimi</button>
  <button data-tab="adm" class="admin-only"><span class="icon">⚙️</span>ADM</button>
</nav>
<script src="/js/api.js?v=3"></script>
<script src="/js/app.js?v=22"></script>

</html>
